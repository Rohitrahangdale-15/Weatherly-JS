<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container text-center">
        <h1 class="mt-4 display-6 fw-bold text-white">Wetherly JS</h1>
        <p class="fst-italic text-white fw-bold">Your direct line to the sky</p>

        <div class="weather-container mx-auto shadow col-md-8">

            <div class="input-group md-3">
                <input type="text" id="input-box" class="form-control" placeholder="Enter city name" autocomplete="off">
                 <button type="button" class="btn btn-outline-secondary" id="button">
                 <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <div id="error-message" class="alert alert-danger d-none" role="alert">
               ❌ City Not Found, Please enter a valid city name.
            </div>

            <div class="weather-body d-none" id="weather-body">
                <div class="mb-3">
                    <h3 id="city">Bhopal, IN</h3>
                    <p id="date">Sunday, 1 Nov, 2026</p>
                </div>

                <div class="mb-3">
                    <h3 id="temp">30'C</h3>
                    <p id="min-max">30'C (min) / 32'C(max)</p>
                    <p id="weather">Clear</p>
                </div>

                <div class="row text-center">

                    <div class="col-md-4">
                        <div class="card info-card">
                            <div class="card-body"> 
                            <img src="images/icons-humidity.png" alt="">
                            <p class="mt-2" id="humidity">41%</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card info-card">
                            <div class="card-body"> 
                            <img src="images/icons-wind.png" alt="">
                            <p class="mt-2" id="wind">8 Kmph</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card info-card">
                            <div class="card-body"> 
                            <img src="images/icons-gauge.png" alt="">
                            <p class="mt-2" id="pressure">1005hP</p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
